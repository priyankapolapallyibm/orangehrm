name: CD — Deploy QA (manual / hotfix)

# ─────────────────────────────────────────────────────────────────────────────
# Manual QA deployment for hotfixes or re-deploys.
# Normal flow: QA is promoted automatically by deploy-dev.yml after QA Gate.
# Use this workflow only to manually trigger a QA re-deploy or hotfix.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual QA deploy (e.g. hotfix, re-deploy)'
        required: true
        default: 're-deploy'

permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  UI_TEST_PROJECT: 'OrangeHRM.UIAutomation.Tests/OrangeHRM.UIAutomation.Tests.csproj'

jobs:
  # ── Re-run QA gate before manual deploy ────────────────────────────────────
  qa-gate-manual:
    name: 🧪 QA Gate (manual)
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout UI automation repo
        uses: actions/checkout@v4
        with:
          repository: priyankapolapallyibm/OrangeHRM-UIAutomation
          path: automation

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Setup app database
        working-directory: app
        run: npm run db:setup

      - name: Start app
        working-directory: app
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && echo "✅ API ready" && break
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { cat /tmp/app.log; exit 1; }
          for i in $(seq 1 20); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && echo "✅ Web ready" && break
            sleep 2
          done

      - name: Build automation
        working-directory: automation
        run: |
          dotnet restore ${{ env.UI_TEST_PROJECT }}
          dotnet build ${{ env.UI_TEST_PROJECT }} --no-restore --configuration Release

      - name: Install Playwright
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        run: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run full UI test suite
        working-directory: automation
        env:
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__ApiBaseUrl: http://localhost:3000/api
          TEST_TestSettings__Browser: chromium
          TEST_TestSettings__Headless: 'true'
          TEST_TestSettings__ScreenshotOnFailure: 'true'
          TEST_TestSettings__DefaultTimeout: '60000'
        run: |
          dotnet test ${{ env.UI_TEST_PROJECT }} \
            --no-build --configuration Release \
            --logger "trx;LogFileName=QAManualResults.trx" \
            --logger "console;verbosity=normal"

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-manual-report-${{ github.run_number }}
          path: automation/OrangeHRM.UIAutomation.Tests/bin/Release/net8.0/Reports/
          retention-days: 14
          if-no-files-found: warn

  # ── Deploy QA only if gate passed ──────────────────────────────────────────
  deploy-qa:
    name: 🚀 Deploy → QA
    runs-on: ubuntu-latest
    needs: qa-gate-manual
    environment: qa
    if: success()
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API for QA
        run: npm run build --workspace api

      - name: Prepare QA database
        run: |
          npm run prisma:generate --workspace api
          npx cross-env DATABASE_URL=file:./apps/api/prisma/qa.db \
            prisma migrate deploy --schema=./apps/api/prisma/schema.prisma

      - name: QA deploy summary
        run: |
          {
            echo "## 🚀 QA Deployment (Manual)"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Reason** | ${{ github.event.inputs.reason }} |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Triggered by** | ${{ github.actor }} |"
            echo "| **QA URL** | http://qa.peopleflow.local:5174 |"
            echo "| **Status** | ✅ Deployed |"
          } >> "$GITHUB_STEP_SUMMARY"

