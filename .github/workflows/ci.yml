name: CI — Pull Request Gate

# ─────────────────────────────────────────────────────────────────────────────
# Runs on every PR targeting main.
# Gate: lint + unit tests + build + smoke UI tests must all pass before merge.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── 1. Lint + Unit Tests + Build ──────────────────────────────────────────
  validate:
    name: Lint · Unit Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database
        run: npm run db:setup

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: API integration tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # ── 2. Smoke UI tests (fast subset) on every PR ───────────────────────────
  smoke-ui:
    name: Smoke UI Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    env:
      DOTNET_VERSION: '8.0.x'
      NODE_VERSION: '20'
      UI_TEST_PROJECT: 'OrangeHRM.UIAutomation.Tests/OrangeHRM.UIAutomation.Tests.csproj'

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout UI automation repo
        uses: actions/checkout@v4
        with:
          repository: priyankapolapallyibm/OrangeHRM-UIAutomation
          path: automation

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Setup app database
        working-directory: app
        run: npm run db:setup

      - name: Start app (API + Web)
        working-directory: app
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && echo "✅ API ready" && break
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || { echo "❌ API failed"; cat /tmp/app.log; exit 1; }
          for i in $(seq 1 20); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && echo "✅ Web ready" && break
            sleep 2
          done

      - name: Build automation project
        working-directory: automation
        run: |
          dotnet restore ${{ env.UI_TEST_PROJECT }}
          dotnet build ${{ env.UI_TEST_PROJECT }} --no-restore --configuration Release

      - name: Install Playwright (chromium)
        working-directory: automation/OrangeHRM.UIAutomation.Tests
        run: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run Smoke tests
        working-directory: automation
        env:
          TEST_TestSettings__BaseUrl: http://localhost:5173
          TEST_TestSettings__ApiBaseUrl: http://localhost:3000/api
          TEST_TestSettings__Browser: chromium
          TEST_TestSettings__Headless: 'true'
          TEST_TestSettings__ScreenshotOnFailure: 'true'
          TEST_TestSettings__DefaultTimeout: '60000'
        run: |
          dotnet test ${{ env.UI_TEST_PROJECT }} \
            --no-build --configuration Release \
            --filter "Category=Smoke" \
            --logger trx;LogFileName=SmokeResults.trx \
            --logger console;verbosity=normal

      - name: Publish smoke test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Smoke UI Results (PR)
          path: automation/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload smoke screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-screenshots-pr${{ github.event.number }}
          path: automation/OrangeHRM.UIAutomation.Tests/bin/Release/net8.0/Reports/Screenshots/
          retention-days: 7
          if-no-files-found: ignore

