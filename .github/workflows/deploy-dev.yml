name: Deploy Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_VM_HOST }}
          username: ${{ secrets.DEV_VM_USER }}
          key: ${{ secrets.DEV_VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/peopleflow

            # Pull latest code
            git pull origin main

            # Write environment file (never committed to git)
            cat > .env.dev <<'ENVEOF'
            COMPOSE_PROJECT_NAME=peopleflow-dev
            NODE_ENV=production
            JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            DEMO_ADMIN_USERNAME=${{ secrets.DEV_ADMIN_USERNAME }}
            DEMO_ADMIN_PASSWORD=${{ secrets.DEV_ADMIN_PASSWORD }}
            WEB_ORIGIN=http://${{ secrets.DEV_VM_HOST }}:8080
            API_UPSTREAM=http://api:3000
            DATABASE_URL=file:/data/peopleflow.db
            DEV_WEB_PORT=8080
            DEV_DATA_VOLUME=peopleflow-dev-data
            ENVEOF

            # Build and deploy
            bash scripts/deploy-linux.sh dev

      - name: Health check dev
        run: |
          sleep 15
          curl --fail --retry 5 --retry-delay 5 \
            http://${{ secrets.DEV_VM_HOST }}:8080/health
